[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localdog"
version = "0.1.0"
description = "LocalDog — local MTProto-to-WebSocket bridge for Telegram Desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "PySide6>=6.6",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
localdog = "localdog.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
packages = ["localdog", "localdog.proxy", "localdog.ui", "localdog.utils"]
